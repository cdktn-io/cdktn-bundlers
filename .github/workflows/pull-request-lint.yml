#
# PRs are squash-merged with the PR title as the commit message, and
# release-please derives versions and changelogs from those commits, so the
# title must be a conventional commit. Runs from the base branch
# (pull_request_target) and never checks out the PR's code.

name: pull-request-lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
