version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message: # PR titles must be conventional commits
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message: # PR titles must be conventional commits
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
